
[package]
name = "server-salvo"
version = "0.1.0"
edition = "2024"

[dependencies]
shared = { path = "../shared" }

tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "fs"] }
tokio-stream = "0.1"
salvo = { version = "0.96", features = [
    "sse",
    "quinn",
    "anyhow",
    "serve-static",
    "logging",
    "force-https",
    "size-limiter",
] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
bytes = "1"

uuid = { version = "1", features = ["v4"] }
indoc = "2"
#const_format = "0.2"

toml = "1"
serde = "1"
bitcode = { version = "0.6" }
serde_json = { version = "1.0", features = ["raw_value"] }
#html2md = "0.2.15"
htmd = "0.5"

deadpool-postgres = "0.14"
tokio-postgres = { version = "0.7", features = ["with-uuid-0_8"] }
chrono = "0.4"
redis = { version = "1.6", features = [
    "tokio-comp",
    "connection-manager",
    "aio",
] }

pulldown-cmark = "0.13"

lettre = { version = "0.11", features = ["sendmail-transport"] }
mime_guess = "2.0"
mailparse = "0.16"
const_format = "0.2"
mail-parser = "0.11"
lol_html = "3.0"

sha2 = "0.11"
base64 = "0.23"
